<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saskatchewan Wildfire &amp; Friendship Centre Map</title>
  </head>
  <body>
    <div id="map"></div>
    <aside id="panel">
      <header>
        <h1>Saskatchewan Wildfire Map</h1>
        <button id="panel-toggle" aria-expanded="true" aria-controls="panel-body">Hide</button>
      </header>
      <div id="panel-body">
        <div id="notices"></div>

        <section class="group">
          <h2>Current conditions</h2>
          <div id="layers-current"></div>
          <div id="weather-controls" class="layer-block">
            <label for="weather-layer" class="layer-title">Fire weather (CWFIS)</label>
            <select id="weather-layer"></select>
            <label for="weather-date">Date</label>
            <input id="weather-date" type="date" />
            <img id="weather-legend" alt="Legend for the selected fire weather layer" />
          </div>
          <p class="hint">Live data from Natural Resources Canada, Canadian Wildland Fire Information System.</p>
        </section>

        <section class="group">
          <h2>Historical</h2>
          <label>Showing <output id="year-label"></output></label>
          <div id="year-slider"></div>
          <div class="row">
            <button id="play" type="button">▶ Play</button>
            <span class="hint">steps one year at a time</span>
          </div>
          <div id="layers-historical"></div>
          <div id="fire-filters">
            <label>Minimum fire size <output id="size-label"></output></label>
            <div id="size-slider"></div>
            <p class="count"><output id="fire-count">0</output> fires shown</p>
          </div>
        </section>

        <section class="group">
          <h2>Reference</h2>
          <div id="layers-reference"></div>
        </section>

        <p id="live-status" class="hint">Loading…</p>
      </div>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
